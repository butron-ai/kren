<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Kren...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 500;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #888888;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            color: #000000;
            background-color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }
        a:hover {
            opacity: 0.9;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Opening in Kren..</h1>
        <p>If you haven't installed Kren already —</p>
        <a href="https://google.com">Download Kren</a>
    </div>

    <script>
        // If GitHub routes a sub-path like /kren/join here via the 404 fallback,
        // this script keeps the ?code=427ED8 parameters active so the app or link can process it.
        if (window.location.pathname.includes('/join')) {
            var cleanTarget = window.location.protocol + '//' + window.location.hostname + '/kren/' + window.location.search;
            window.history.replaceState(null, null, cleanTarget);
        }
    </script>
</body>
</html>
