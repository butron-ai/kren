<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Opening Kren...</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
    </style>
    <script type="text/javascript">
        // Capture the broken sub-route path and its queries (e.g., /kren/join?code=427ED8)
        var currentPath = window.location.pathname;
        var currentQuery = window.location.search;
        
        // Save the full link parameters so the main landing page or app intent can still parse it
        sessionStorage.setItem('redirect_path', currentPath + currentQuery);
        
        // Silently bounce the user back to the primary working folder
        window.location.href = window.location.protocol + '//' + window.location.hostname + '/kren/';
    </script>
</head>
<body>
</body>
</html>
