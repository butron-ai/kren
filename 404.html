<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Kren...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 500;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #888888;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            color: #000000;
            background-color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border-radius: 6px;
            transition: opacity 0.2s ease;
        }
        a:hover {
            opacity: 0.9;
        }
        .app-link {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 12px;
            display: none; /* Shown dynamically if invite code is present */
        }
        .app-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1 id="title-text">Opening in Kren..</h1>
        <p id="desc-text">Redirecting you to the group chat...</p>
        
        <!-- Manual redirect option if auto-redirect doesn't catch -->
        <a href="#" id="open-app-btn" class="app-link">Join Group in App</a>
        
        <p style="margin: 16px 0 8px 0; font-size: 12px; color: #555555;">Or if you haven't installed Kren already —</p>
        <a href="https://github.com/butron-ai/Kren-download/releases/download/App/Kren.apk">Download Kren APK</a>
    </div>

    <script>
        // 1. URL cleaner logic (remains active for routes like /kren/join via 404 router)
        if (window.location.pathname.includes('/join')) {
            var cleanTarget = window.location.protocol + '//' + window.location.hostname + '/kren/' + window.location.search;
            window.history.replaceState(null, null, cleanTarget);
        }

        // 2. Parse invite code parameters
        var urlParams = new URLSearchParams(window.location.search);
        var code = urlParams.get('code');

        if (code) {
            var customUri = 'kren://join?code=' + encodeURIComponent(code);

            // Update UI to show manual join button
            var openBtn = document.getElementById('open-app-btn');
            if (openBtn) {
                openBtn.href = customUri;
                openBtn.style.display = 'inline-block';
            }

            // 3. Trigger auto-redirect immediately using the custom URI scheme
            window.location.href = customUri;
        } else {
            // Adjust texts if it is just a generic visit with no invite code
            document.getElementById('title-text').innerText = "Kren AI Assistant";
            document.getElementById('desc-text').innerText = "Download the official app below to start chatting.";
            var spinner = document.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
        }
    </script>
</body>
</html>
